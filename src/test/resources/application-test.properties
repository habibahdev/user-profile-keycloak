# bdd de test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestion_user_profil}
spring.datasource.username=${DATASOURCE_USERNAME:gestion_user}
spring.datasource.password=${DATASOURCE_PASSWORD:gestion_user}

# flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:migrations
spring.flyway.validate-on-migrate=true

# tables doit être == aux entités
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false